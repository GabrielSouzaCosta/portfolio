<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Firmament live</title>
<link rel="stylesheet" href="../css/fonts.css">
<style>
  :root { --paper: #eee7d8; --ink: #29352c; --green: #28543c; }
  html, body { margin: 0; background: var(--paper); color: var(--ink); font-family: Manrope, sans-serif; }
  .hero { position: relative; min-height: 100vh; min-height: 100svh; display: flex; align-items: center; padding: 80px clamp(44px, 5vw, 88px) 80px clamp(125px, 11.4vw, 185px); box-sizing: border-box; overflow: hidden; isolation: isolate; }
  .hero canvas { position: absolute; inset: 0; width: 100%; height: 100%; z-index: -2; display: block; }
  .copy { width: min(660px, 68%); opacity: 0; transform: translateY(14px); transition: opacity 1.4s ease, transform 1.4s cubic-bezier(.2, .7, .2, 1); }
  .hero.is-awake .copy { opacity: 1; transform: none; }
  h1, p { text-shadow: 0 0 18px #eee7d8, 0 0 4px #eee7d8cc; }
  h1 { font: 400 clamp(64px, 6.8vw, 96px)/1.04 "Instrument Serif", serif; letter-spacing: -.025em; margin: 0; }
  h1 em { color: var(--green); }
  p { max-width: 395px; margin: 30px 0 29px; color: #364333; font-size: 15px; line-height: 1.85; }
  strong { font-weight: 600; }
  .cta { display: inline-flex; align-items: center; gap: 23px; min-height: 58px; padding: 7px 7px 7px 22px; box-sizing: border-box; background: var(--green); color: var(--paper); border-radius: 3px; font-size: 12px; font-weight: 600; text-decoration: none; }
  .cta span { display: grid; place-items: center; width: 41px; height: 41px; border-left: 1px solid #ffffff35; }
  .replay { position: fixed; right: 16px; bottom: 16px; z-index: 3; font: 600 12px Manrope, sans-serif; padding: 9px 13px; border: 1px solid var(--green); border-radius: 3px; background: var(--paper); color: var(--green); cursor: pointer; }
  @media (max-width: 850px) {
    .hero { align-items: flex-start; padding: 110px 27px 380px; min-height: max(880px, 100svh); }
    .copy { width: 100%; }
    h1 { font-size: clamp(44px, 14.2vw, 82px); }
  }
</style>
</head>
<body>
<section class="hero" id="hero">
  <canvas aria-hidden="true"></canvas>
  <div class="copy">
    <h1>Imaginar é<br><em>o primeiro passo.</em></h1>
    <p>Sou <strong>Gabriel Souza Costa</strong>, desenvolvedor de software.<br>Crio produtos web e mobile, combinando experiência técnica, visão de produto e agentes de IA.</p>
    <a class="cta" href="#">Vamos dar forma à sua ideia <span>↗</span></a>
  </div>
</section>
<button class="replay" type="button">↻ Rever abertura</button>
<script src="firmament/firmament.js"></script>
</body>
</html>
