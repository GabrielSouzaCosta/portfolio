<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Firmament creatures</title>
<link rel="stylesheet" href="../css/fonts.css">
<style>
  body { margin: 0; background: #eee7d8; color: #29352c; font-family: Manrope, sans-serif; }
  .hero { position: relative; min-height: 100vh; display: flex; align-items: center; padding: 80px clamp(44px, 5vw, 88px) 80px clamp(125px, 11.4vw, 185px); box-sizing: border-box; overflow: hidden; }
  .art { position: absolute; inset: 0; z-index: -2; background: url('cosmic/fantastic/pilgrims.webp') 64% center / cover; }
  .hero[data-variant="b"] .art { background-image: url('cosmic/fantastic/shepherds.webp'); }
  .hero[data-variant="c"] .art { background-image: url('cosmic/fantastic/menagerie.webp'); }
  .wash { position: absolute; inset: 0; z-index: -1; background: linear-gradient(90deg, #eee7d899, #eee7d829 46%, #eee7d800 70%); }
  .copy { width: min(660px, 68%); }
  h1 { font: 400 clamp(64px, 6.8vw, 96px)/1.04 "Instrument Serif", serif; letter-spacing: -.025em; margin: 0; }
  h1 em { color: #28543c; }
  p { max-width: 395px; margin: 30px 0 29px; color: #364333; font-size: 15px; line-height: 1.85; }
  strong { font-weight: 600; }
  .cta { display: inline-flex; align-items: center; gap: 23px; min-height: 58px; padding: 7px 7px 7px 22px; box-sizing: border-box; background: #28543c; color: #eee7d8; border-radius: 3px; font-size: 12px; font-weight: 600; }
  .cta span { display: grid; place-items: center; width: 41px; height: 41px; border-left: 1px solid #ffffff35; }
  .switch { position: fixed; right: 16px; bottom: 16px; display: flex; gap: 8px; z-index: 3; }
  .switch button { font: 600 12px Manrope, sans-serif; padding: 9px 13px; border: 1px solid #28543c; border-radius: 3px; background: #eee7d8; color: #28543c; cursor: pointer; }
  .switch button[aria-pressed="true"] { background: #28543c; color: #eee7d8; }
  @media (max-width: 850px) {
    .hero { align-items: flex-start; padding: 134px 27px 390px; min-height: max(880px, 100svh); }
    .art { background-size: auto 640px; background-position: 83% 100%; background-repeat: no-repeat; }
    .wash { background: linear-gradient(180deg, #eee7d8, #eee7d8ed 35%, #eee7d800 64%); }
    .copy { width: 100%; }
    h1 { font-size: clamp(44px, 14.2vw, 82px); }
  }
</style>
</head>
<body>
<section class="hero" id="hero" data-variant="a">
  <div class="art"></div><div class="wash"></div>
  <div class="copy">
    <h1>Imaginar é<br><em>o primeiro passo.</em></h1>
    <p>Sou <strong>Gabriel Souza Costa</strong>, desenvolvedor de software.<br>Crio produtos web e mobile, combinando experiência técnica, visão de produto e agentes de IA.</p>
    <a class="cta" href="#">Vamos dar forma à sua ideia <span>↗</span></a>
  </div>
</section>
<div class="switch">
  <button type="button" data-variant="a" aria-pressed="true">A · Peregrinos celestes</button>
  <button type="button" data-variant="b" aria-pressed="false">B · Pastores de estrelas</button>
  <button type="button" data-variant="c" aria-pressed="false">C · Bestiário celeste</button>
</div>
<script>
  // Static style preview: no animation until a direction is chosen.
  const hero = document.getElementById('hero');
  for (const button of document.querySelectorAll('.switch button')) {
    button.addEventListener('click', () => {
      hero.dataset.variant = button.dataset.variant;
      for (const other of document.querySelectorAll('.switch button')) other.setAttribute('aria-pressed', String(other === button));
    });
  }
</script>
</body>
</html>
